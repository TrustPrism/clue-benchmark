name: Private candidate artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    environment: reviewed-candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install '.[test,docs,providers]' twine
      - run: pytest -q
      - run: mkdocs build --strict
      - run: python -m build
      - run: twine check dist/*
      - run: python scripts/release_audit.py --history --output dist/release-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-distributions
          path: dist/*
