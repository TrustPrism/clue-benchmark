name: Reviewed documentation deployment
on:
  workflow_dispatch:
    inputs:
      rights_cleared:
        description: Owner has approved public docs deployment
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  documentation:
    if: inputs.rights_cleared
    environment: reviewed-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - run: test -f LICENSE && test -f release/PUBLICATION_APPROVED
      - run: python -m pip install '.[docs]'
      - run: mkdocs build --strict
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
