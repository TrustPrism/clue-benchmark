name: Private candidate artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    environment: reviewed-candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - run: python -m pip install '.[test,docs,providers]' twine
      - run: pytest -q
      - run: mkdocs build --strict
      - run: python -m build
      - run: twine check dist/*
      - run: python scripts/release_audit.py --history --output dist/release-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-distributions
          path: dist/*
