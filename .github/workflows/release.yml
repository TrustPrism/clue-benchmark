name: Reviewed release publication
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed v0.5.0 release tag
        type: string
        required: true
      candidate_run_id:
        description: Successful private candidate workflow run whose exact artifacts were reviewed
        type: string
        required: true
      rights_cleared:
        description: Owner has cleared rights, reviews, exact artifacts and publication
        type: boolean
        default: false
        required: true
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: inputs.rights_cleared && startsWith(inputs.tag, 'v0.5.0')
    environment: reviewed-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Verify tag, candidate source and recorded owner clearance
        env:
          TAG: ${{ inputs.tag }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f LICENSE
          test -f release/PUBLICATION_APPROVED
          tag_revision=$(git rev-parse "refs/tags/$TAG^{commit}")
          candidate_revision=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN" --jq .head_sha)
          candidate_status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN" --jq .conclusion)
          test "$candidate_status" = success
          test "$candidate_revision" = "$tag_revision"
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-distributions
          path: dist
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Verify exact reviewed artifact hashes
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          manifest = json.loads(pathlib.Path('dist/release-manifest.json').read_text())
          assert manifest['source_revision'] == subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          assert not manifest['artifact_scan_findings']
          for name, record in manifest['artifacts'].items():
              artifact = pathlib.Path('dist') / pathlib.Path(name).name
              assert hashlib.sha256(artifact.read_bytes()).hexdigest() == record['sha256']
          PY
  publish:
    needs: verify
    environment: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-distributions
          path: candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Select immutable distributions only
        run: |
          mkdir dist
          cp candidate/*.whl candidate/*.tar.gz dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
