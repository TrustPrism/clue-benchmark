name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv
      - run: uv sync --locked --extra test --extra inspect --extra metadata --extra providers --python "${{ matrix.python }}"
      - run: uv run --locked ruff check src tests scripts
      - run: uv run --locked ruff format --check src tests scripts
      - run: uv run --locked pytest -q
      - run: uv run --locked python -m build
      - run: uv run --locked python scripts/check_release.py
      - run: uv run --locked python scripts/smoke_wheel.py
      - run: uv run --locked mlcroissant validate --jsonld data/v0.3/croissant.json
